up:
  desc: "Запустить профиль"
  parameters:
    - __profile__
  commands:
    - "docker compose -f init-compose.yaml up -d --no-recreate"
    - "docker compose --profile __placeholder_1__ up -d --no-recreate"

build:
  desc: "Собрать образы профиля"
  parameters:
    - __profile__
  commands:
    - "docker compose --profile __placeholder_1__ build"

submodules:
  desc: "Подключить/обновить подмодули с ROS-пакетами из submodules.yaml"
  # без имен подключаются все подмодули, поэтому хвост необязательный
  long_command: true
  optional_tail: true
  commands:
    - "python3 __submodules_script__ __placeholder_1__"

start:
  desc: "Свежий матч из config/match.yaml (алиас start_match)"
  commands:
    - "helm start_match"

stop:
  desc: "Остановить обоих роботов в duel"
  commands:
    - "helm stop_match"

start_match:
  desc: "Свежий матч из config/match.yaml без пересборки"
  commands:
    - "python3 ../benchmarks/start_match.py"

stop_match:
  desc: "Остановить duel и сохранить итоговые метрики"
  commands:
    - "docker compose exec -T hsl-decision bash -lc \"source /autoware/install/setup.bash && ros2 service call /match/allow_motion std_srvs/srv/SetBool '{data: false}'\""
    - "docker compose exec -T hsl-opponent-decision bash -lc \"source /autoware/install/setup.bash && ros2 service call /opponent/match/allow_motion std_srvs/srv/SetBool '{data: false}'\""

terminate-init:
  desc: "(debug команда) Остановить init сервисы"
  commands:
    - "docker compose -f init-compose.yaml down -t0"

down:
  desc: "Остановить профиль"
  parameters:
    - __profile__
  commands:
    - "docker compose --profile __placeholder_1__ kill"

restart:
  desc: "Перезапустить контейнеры по профилю"
  parameters:
    - __profile__
  commands:
    # Не делаем restart, чтобы точно не пересоздать контейнеры
    - "docker compose --profile __placeholder_1__ kill"
    - "docker compose --profile __placeholder_1__ up -d --no-recreate"

clean:
  desc: "Очистить контейнеры по профилю"
  parameters:
    - __profile__
  commands:
    - "docker compose --profile __placeholder_1__ down -t0"

commit:
  desc: "Закоммитить контейнер сервиса в уже существующий или новый образ"
  parameters:
    - __service__
    - __image__
  resolvers:
    1:
      __placeholder_1__: get_container_id_by_profile
  commands:
    - "docker commit --change=\"CMD \"/bin/bash\"\" __placeholder_1__ __placeholder_2__"
    - "echo COMMITED __placeholder_1__ INTO __placeholder_2__"

ps:
  desc: "Показать запущенные сервисы"
  commands:
    - "docker compose ps
      --all
      --format
      'table {{.Service}}\t{{.State}}\t{{.Status}}\t{{.Name}}\t{{.Image}}'"

flogs:
  desc: "Показать все логи для профиля и отслеживать"
  parameters:
    - __profile__
  commands:
    - "docker compose --profile __placeholder_1__ logs -f"

enter:
  desc: "Войти в контейнер по сервису"
  parameters:
    - __service__
  commands:
    - "docker compose exec __placeholder_1__ bash"
    - "echo Exit service: __placeholder_1__"

exec:
  desc: "Выполнить команду внутри контейнера по сервису"
  parameters:
    - __service__
  long_command: true
  commands:
    - "docker compose exec __placeholder_1__ bash -c 'source /autoware/install/setup.bash && __placeholder_2__'"

# Real robot uses its own Compose project, without Gazebo or GPU runtime.
build_real:
  desc: "Собрать стек и драйверы реального робота"
  commands:
    - "python3 ../tools/real_robot.py build"

start_real:
  desc: "Запустить драйверы и навигацию, движение закрыто"
  commands:
    - "python3 ../tools/real_robot.py start"

enable_real:
  desc: "Разрешить движение после проверки готовности"
  commands:
    - "python3 ../tools/real_robot.py enable"

pause_real:
  desc: "Остановить движение, оставить драйверы"
  commands:
    - "python3 ../tools/real_robot.py pause"

stop_real:
  desc: "Остановить движение и контейнер робота"
  commands:
    - "python3 ../tools/real_robot.py stop"

status_real:
  desc: "Состояние реального робота"
  commands:
    - "python3 ../tools/real_robot.py status"

logs_real:
  desc: "Логи реального робота"
  commands:
    - "python3 ../tools/real_robot.py logs"

enter_real:
  desc: "Терминал реального робота"
  commands:
    - "python3 ../tools/real_robot.py shell"
