services:
    vehicle:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - vehicle

    sensing:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - sensing

    # Локализация идёт из симулятора: плагин gazebo_ros_p3d в URDF публикует
    # точную позу модели в /localization/pose и TF map -> base_footprint.
    # Отдельный сервис для этого не нужен; здесь останется место под LIO-SAM,
    # когда он будет включён (jr_localization.launch.xml уже готов).
    localization:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - localization
            - simulation

    perception:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - perception
            - simulation

    # Планировщик MPC: строит опорную траекторию в /planning/trajectory.
    # Ноды приходят из подмодуля mpc_motion_control и появляются в образе
    # после `helm submodules` и `helm build`.
    planning:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_planning.launch.xml trajectory:=${MPC_TRAJECTORY:-lanelet} trajectory_file:=${MPC_TRAJECTORY_FILE:-my_trajectory5.yaml}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - planning
            - simulation

    # Контроллер MPC: /planning/trajectory + /odom -> /cmd_vel
    control:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_control.launch.xml lateral:=${MPC_LATERAL:-true} longitudinal:=${MPC_LONGITUDINAL:-cc}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - control
            - simulation

    api:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - api
            - simulation

    # Инструменты отладки: мост Foxglove на порту 8765
    tools:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_tools.launch.xml"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - tools
            - simulation

    # Карта занятости: считается из того же .world, что грузит симулятор,
    # и публикуется в /map как nav_msgs/OccupancyGrid.
    map:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_map.launch.xml map:=${MAP:-maze} resolution:=${MAP_RESOLUTION:-0.05}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - map
            - simulation

    transforms:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - transforms
            - simulation

    # Сервис для отладки, менять и коммитить рекомендуется его
    debug:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - debug

    gazebo:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_sim.launch.py map:=${MAP:-maze} headless:=${GAZEBO_HEADLESS:-true} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${SPAWN_Y:--0.18} spawn_z:=${SPAWN_Z:-0.23}"
        extends:
            file: common.yaml
            service: app
        environment:
            # Путь к ресурсам пакета: по нему Gazebo резолвит меши робота.
            # В команде сервиса дописывается и в GAZEBO_RESOURCE_PATH, и в
            # GAZEBO_MODEL_PATH -- при конвертации URDF в SDF схема
            # package:// становится model://, а она ищется только по
            # MODEL_PATH; без него робот в GUI невидим ("No mesh specified").
            # Именно дописывается, а не заменяет: в /usr/share/gazebo-11 лежат
            # шейдеры, без которых gzclient падает на "Unable to find shader
            # lib". Побочный эффект MODEL_PATH -- безвредные сообщения
            # "Missing model.config" на служебные каталоги ROS внутри share.
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            # Процесс в контейнере идёт от uid 1000, как и пользователь хоста,
            # поэтому cookie X-сервера подходит как есть и `xhost` не нужен.
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -lc 'source /autoware/install/setup.bash && ros2 topic list | grep -qx /clock'"
            interval: 15s
            timeout: 10s
            start_period: 60s
            retries: 5
        profiles:
            - gazebo
            - simulation
        stdin_open: true

    # Изолированный сценарий двух роботов. Основной профиль simulation со
    # штатным planning/control из main остаётся без изменений.
    gazebo-duel:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_duel.launch.py map:=${MAP:-maze} headless:=${GAZEBO_HEADLESS:-true} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${SPAWN_Y:--0.18} spawn_z:=${SPAWN_Z:-0.23} opponent_x:=${OPPONENT_X:-2.5} opponent_y:=${OPPONENT_Y:-2.5} opponent_z:=${OPPONENT_Z:-0.23} opponent_yaw:=${OPPONENT_YAW:-3.14159} lidar_horizontal_samples:=${DUEL_LIDAR_HORIZONTAL_SAMPLES:-360} lidar_vertical_samples:=${DUEL_LIDAR_VERTICAL_SAMPLES:-16}"
        extends:
            file: common.yaml
            service: app
        environment:
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        profiles:
            - duel

    hsl-adapter:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter sim_observations --ros-args -p use_sim_time:=true -p own_spawn_x:=${SPAWN_X:--0.34} -p own_spawn_y:=${SPAWN_Y:--0.18}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-map:
        command: $CMD "source /autoware/install/setup.bash && ros2 run jr_map sdf_map_server.py --ros-args -p world:=/autoware/install/sim_kobuki/share/sim_kobuki/worlds/${MAP:-maze}.world -p resolution:=${MAP_RESOLUTION:-0.05} -p spawn_x:=${SPAWN_X:--0.34} -p spawn_y:=${SPAWN_Y:--0.18} -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-decision:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_decision decision_manager --ros-args --params-file /autoware/install/hsl_decision/share/hsl_decision/config/decision.yaml -p role:=${HSL_ROLE:-explorer} -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-planning:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_planning trajectory_planner --ros-args -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-control:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_debug_control hsl_mpc.launch.py"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter scripted_opponent --ros-args -p use_sim_time:=true -p patrol_end_x:=${OPPONENT_PATROL_X:-1.0} -p patrol_end_y:=${OPPONENT_PATROL_Y:-2.5}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-metrics:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter match_metrics --ros-args -p use_sim_time:=true -p role:=${HSL_ROLE:-explorer} -p own_spawn_x:=${SPAWN_X:--0.34} -p own_spawn_y:=${SPAWN_Y:--0.18}"
        extends:
            file: common.yaml
            service: app
        volumes:
            - ../results:/autoware/match-results:rw
        profiles:
            - duel
