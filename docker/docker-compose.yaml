services:
    vehicle:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - vehicle

    sensing:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - sensing

    # Локализация идёт из симулятора: плагин gazebo_ros_p3d в URDF публикует
    # точную позу модели в /localization/pose и TF map -> base_footprint.
    # Отдельный сервис для этого не нужен; здесь останется место под LIO-SAM,
    # когда он будет включён (jr_localization.launch.xml уже готов).
    localization:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - localization
            - simulation

    perception:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - perception
            - simulation

    api:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - api
            - simulation

    # Инструменты отладки: мост Foxglove на порту 8765
    tools:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_tools.launch.xml"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - tools
            - simulation

    # Карта занятости: считается из того же .world, что грузит симулятор,
    # и публикуется в /map как nav_msgs/OccupancyGrid.
    map:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_map.launch.xml map:=${MAP:-maze} resolution:=${MAP_RESOLUTION:-0.05}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - map
            - simulation

    transforms:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - transforms
            - simulation

    # Сервис для отладки, менять и коммитить рекомендуется его
    debug:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - debug

    gazebo:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_sim.launch.py map:=${MAP:-maze} headless:=${GAZEBO_HEADLESS:-true} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${SPAWN_Y:--0.18} spawn_z:=${SPAWN_Z:-0.23}"
        extends:
            file: common.yaml
            service: app
        environment:
            # Путь к ресурсам пакета: по нему Gazebo резолвит меши робота.
            # В команде сервиса дописывается и в GAZEBO_RESOURCE_PATH, и в
            # GAZEBO_MODEL_PATH -- при конвертации URDF в SDF схема
            # package:// становится model://, а она ищется только по
            # MODEL_PATH; без него робот в GUI невидим ("No mesh specified").
            # Именно дописывается, а не заменяет: в /usr/share/gazebo-11 лежат
            # шейдеры, без которых gzclient падает на "Unable to find shader
            # lib". Побочный эффект MODEL_PATH -- безвредные сообщения
            # "Missing model.config" на служебные каталоги ROS внутри share.
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            # Процесс в контейнере идёт от uid 1000, как и пользователь хоста,
            # поэтому cookie X-сервера подходит как есть и `xhost` не нужен.
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -lc 'source /autoware/install/setup.bash && ros2 topic list | grep -qx /clock'"
            interval: 15s
            timeout: 10s
            start_period: 60s
            retries: 5
        profiles:
            - gazebo
            - simulation
        stdin_open: true

    # Изолированный сценарий двух роботов. Основной профиль simulation со
    # сенсорным стендом; автономная оценка выполняется только в duel.
    gazebo-duel:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_duel.launch.py map:=${MAP:-maze} headless:=${GAZEBO_HEADLESS:-true} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${DUEL_SPAWN_Y:-0.4} spawn_z:=${SPAWN_Z:-0.23} spawn_yaw:=${DUEL_SPAWN_YAW:-0} map_origin_x:=${MAP_ORIGIN_X:--0.34} map_origin_y:=${MAP_ORIGIN_Y:-0.4} opponent_x:=${OPPONENT_X:-2.5} opponent_y:=${OPPONENT_Y:-2.5} opponent_z:=${OPPONENT_Z:-0.23} opponent_yaw:=${OPPONENT_YAW:-3.14159} lidar_horizontal_samples:=${DUEL_LIDAR_HORIZONTAL_SAMPLES:-360} lidar_vertical_samples:=${DUEL_LIDAR_VERTICAL_SAMPLES:-16}"
        extends:
            file: common.yaml
            service: app
        environment:
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        profiles:
            - duel

    hsl-rviz:
        command: $CMD "source /autoware/install/setup.bash && if [ \"$${HSL_RVIZ_ENABLED}\" = false ] || [ -z \"$${DISPLAY}\" ]; then exec sleep infinity; fi; exec rviz2 -d /autoware/install/hsl_debug_control/share/hsl_debug_control/config/duel.rviz --ros-args -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        environment:
            DISPLAY: ${DISPLAY:-}
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
            HSL_RVIZ_ENABLED: ${HSL_RVIZ_ENABLED:-auto}
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        profiles:
            - duel

    hsl-adapter:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_sim_adapter observations.launch.py own_spawn_x:=${MAP_ORIGIN_X:--0.34} own_spawn_y:=${MAP_ORIGIN_Y:-0.4}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-map:
        command: $CMD "source /autoware/install/setup.bash && ros2 run jr_map sdf_map_server.py --ros-args -p world:=/autoware/install/sim_kobuki/share/sim_kobuki/worlds/${MAP:-maze}.world -p resolution:=${MAP_RESOLUTION:-0.05} -p spawn_x:=${MAP_ORIGIN_X:--0.34} -p spawn_y:=${MAP_ORIGIN_Y:-0.4} -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-decision:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_decision decision_manager --ros-args --params-file /autoware/install/hsl_decision/share/hsl_decision/config/decision.yaml -p role:=${HSL_ROLE:-explorer} -p own_start:=${DUEL_FIRST_START:-[-0.5,-0.5,0.5,-0.5,0.5,0.5,-0.5,0.5]} -p opponent_start:=${DUEL_SECOND_START:-[2.59,1.85,3.09,1.85,3.09,2.35,2.59,2.35]} -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-planning:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_planning autonomous.launch.py role:=${HSL_ROLE:-explorer} random_seed:=${DUEL_SEED:-0} arena_bounds:=${DUEL_ARENA_BOUNDS:-[-2.66,-0.4,3.34,4.6]} allow_reverse:=${HSL_ALLOW_REVERSE:-true} max_speed:=${HSL_MAX_SPEED:-0.5} max_angular_speed:=${HSL_MAX_ANGULAR_SPEED:-1.5}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-control:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_debug_control motion.launch.py"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent-adapter:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_sim_adapter observations.launch.py robot_namespace:=opponent own_spawn_x:=${MAP_ORIGIN_X:--0.34} own_spawn_y:=${MAP_ORIGIN_Y:-0.4} own_odom_topic:=/opponent/odom own_truth_topic:=/opponent/localization/pose lidar_topic:=/opponent/livox/lidar"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent-decision:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_decision decision_manager --ros-args -r __ns:=/opponent --params-file /autoware/install/hsl_decision/share/hsl_decision/config/decision_opponent.yaml -p role:=${HSL_OPPONENT_ROLE:-guardian} -p opponent_start:=${DUEL_FIRST_START:-[-0.5,-0.5,0.5,-0.5,0.5,0.5,-0.5,0.5]} -p own_start:=${DUEL_SECOND_START:-[2.59,1.85,3.09,1.85,3.09,2.35,2.59,2.35]} -p use_sim_time:=true"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent-planning:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_planning autonomous.launch.py robot_namespace:=opponent role:=${HSL_OPPONENT_ROLE:-guardian} random_seed:=${DUEL_OPPONENT_SEED:-1} arena_bounds:=${DUEL_ARENA_BOUNDS:-[-2.66,-0.4,3.34,4.6]} allow_reverse:=${HSL_ALLOW_REVERSE:-true} max_speed:=${HSL_MAX_SPEED:-0.5} max_angular_speed:=${HSL_MAX_ANGULAR_SPEED:-1.5}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent-control:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch hsl_debug_control motion.launch.py robot_namespace:=opponent"
        extends:
            file: common.yaml
            service: app
        profiles:
            - duel

    hsl-opponent-metrics:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter match_metrics --ros-args -r __ns:=/opponent -p use_sim_time:=true -p role:=${HSL_OPPONENT_ROLE:-guardian} -p own_spawn_x:=${MAP_ORIGIN_X:--0.34} -p own_spawn_y:=${MAP_ORIGIN_Y:-0.4} -p own_truth_topic:=/opponent/localization/pose -p opponent_truth_topic:=/localization/pose -p other_model:=kobuki -p result_dir:=/autoware/match-results/opponent -p run_id:=${DUEL_RUN_ID:-manual} -p seed:=${DUEL_SEED:-0} -p code_revision:='\"${DUEL_REVISION:-unknown}\"'"
        extends:
            file: common.yaml
            service: app
        volumes:
            - ${HSL_RESULTS_DIR:-../results}:/autoware/match-results:rw
        profiles:
            - duel

    hsl-metrics:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter match_metrics --ros-args -p use_sim_time:=true -p role:=${HSL_ROLE:-explorer} -p own_spawn_x:=${MAP_ORIGIN_X:--0.34} -p own_spawn_y:=${MAP_ORIGIN_Y:-0.4} -p run_id:=${DUEL_RUN_ID:-manual} -p seed:=${DUEL_SEED:-0} -p code_revision:='\"${DUEL_REVISION:-unknown}\"'"
        extends:
            file: common.yaml
            service: app
        volumes:
            - ${HSL_RESULTS_DIR:-../results}:/autoware/match-results:rw
        profiles:
            - duel

    hsl-referee:
        command: $CMD "source /autoware/install/setup.bash && ros2 run hsl_sim_adapter duel_referee --ros-args -p use_sim_time:=true -p first_role:=${HSL_ROLE:-explorer} -p second_role:=${HSL_OPPONENT_ROLE:-guardian} -p max_active_s:=${DUEL_MAX_ACTIVE_S:-360.0} -p spawn_x:=${MAP_ORIGIN_X:--0.34} -p spawn_y:=${MAP_ORIGIN_Y:-0.4} -p first_start:=${DUEL_FIRST_START:-[-0.5,-0.5,0.5,-0.5,0.5,0.5,-0.5,0.5]} -p second_start:=${DUEL_SECOND_START:-[2.59,1.85,3.09,1.85,3.09,2.35,2.59,2.35]} -p run_id:=${DUEL_RUN_ID:-manual} -p seed:=${DUEL_SEED:-0} -p code_revision:='\"${DUEL_REVISION:-unknown}\"'"
        extends:
            file: common.yaml
            service: app
        volumes:
            - ${HSL_RESULTS_DIR:-../results}:/autoware/match-results:rw
        profiles:
            - duel
