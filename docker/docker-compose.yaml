services:
    vehicle:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - vehicle

    sensing:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - sensing

    localization:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - localization

    perception:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - perception
            - simulation

    planning:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - planning
            - simulation

    control:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - control
            - simulation

    api:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - api
            - simulation

    tools:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - tools
            - simulation

    transforms:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - transforms
            - simulation

    # Сервис для отладки, менять и коммитить рекомендуется его
    debug:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - debug

    gazebo:
        command: $CMD "export LD_LIBRARY_PATH=/opt/rgl/plugins:$${LD_LIBRARY_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_sim.launch.py headless:=${GAZEBO_HEADLESS:-true}"
        extends:
            file: common.yaml
            service: app
        environment:
            GZ_PARTITION: hackathon2026
            GZ_SIM_RESOURCE_PATH: /autoware/install/sim_kobuki/share
            GZ_SIM_SYSTEM_PLUGIN_PATH: /opt/rgl/plugins
            GZ_GUI_PLUGIN_PATH: /opt/rgl/gui
            RGL_PATTERNS_DIR: /opt/rgl/lidar_patterns
            GZ_HEADLESS_RENDERING: ${GAZEBO_HEADLESS:-true}
            DISPLAY: ${DISPLAY:-:0}
            # Процесс в контейнере идёт от uid 1000, как и пользователь хоста,
            # поэтому cookie X-сервера подходит как есть и `xhost` не нужен.
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -lc 'source /autoware/install/setup.bash && ros2 topic list | grep -qx /clock'"
            interval: 15s
            timeout: 10s
            start_period: 60s
            retries: 5
        profiles:
            - gazebo
            - simulation
        stdin_open: true
