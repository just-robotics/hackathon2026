services:
    vehicle:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - vehicle

    sensing:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - sensing

    # Локализация идёт из симулятора: плагин gazebo_ros_p3d в URDF публикует
    # точную позу модели в /localization/pose и TF map -> base_footprint.
    # Отдельный сервис для этого не нужен; здесь останется место под LIO-SAM,
    # когда он будет включён (jr_localization.launch.xml уже готов).
    localization:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - localization
            - simulation

    # Детектор соперника: каждый робот дуэли ищет другого в облаке своего
    # лидара и публикует его в /<робот>/opponent/odom. Нужно облако, то есть
    # LIDAR=true. В профиле simulation сервиса нет: там робот один и искать
    # некого.
    perception:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_perception.launch.xml map:=${DUEL_MAP:-totami}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - perception
            - duel

    # Планировщик MPC: строит опорную траекторию в /planning/trajectory.
    # Ноды приходят из подмодуля mpc_motion_control и появляются в образе
    # после `helm submodules` и `helm build`.
    planning:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_planning.launch.xml trajectory:=${MPC_TRAJECTORY:-lanelet} trajectory_file:=${MPC_TRAJECTORY_FILE:-my_trajectory5.yaml}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - planning
            - simulation

    # Контроллер MPC: /planning/trajectory + /odom -> /cmd_vel
    control:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_control.launch.xml lateral:=${MPC_LATERAL:-true} longitudinal:=${MPC_LONGITUDINAL:-cc}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - control
            - simulation

    api:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - api
            - simulation

    # Инструменты отладки: мост Foxglove на порту 8765
    tools:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_tools.launch.xml"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - tools
            - simulation

    # Карта занятости: считается из того же .world, что грузит симулятор,
    # и публикуется в /map как nav_msgs/OccupancyGrid.
    map:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch jr_launch jr_map.launch.xml map:=${MAP:-maze} resolution:=${MAP_RESOLUTION:-0.05} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${SPAWN_Y:--0.18}"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - map
            - simulation

    transforms:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - transforms
            - simulation

    # Сервис для отладки, менять и коммитить рекомендуется его
    debug:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - debug

    gazebo:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_sim.launch.py map:=${MAP:-maze} headless:=${GAZEBO_HEADLESS:-true} lidar:=${LIDAR:-false} spawn_x:=${SPAWN_X:--0.34} spawn_y:=${SPAWN_Y:--0.18} spawn_z:=${SPAWN_Z:-0.23}"
        extends:
            file: common.yaml
            service: app
        environment:
            # Путь к ресурсам пакета: по нему Gazebo резолвит меши робота.
            # В команде сервиса дописывается и в GAZEBO_RESOURCE_PATH, и в
            # GAZEBO_MODEL_PATH -- при конвертации URDF в SDF схема
            # package:// становится model://, а она ищется только по
            # MODEL_PATH; без него робот в GUI невидим ("No mesh specified").
            # Именно дописывается, а не заменяет: в /usr/share/gazebo-11 лежат
            # шейдеры, без которых gzclient падает на "Unable to find shader
            # lib". Побочный эффект MODEL_PATH -- безвредные сообщения
            # "Missing model.config" на служебные каталоги ROS внутри share.
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            # Процесс в контейнере идёт от uid 1000, как и пользователь хоста,
            # поэтому cookie X-сервера подходит как есть и `xhost` не нужен.
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -lc 'source /autoware/install/setup.bash && ros2 topic list | grep -qx /clock'"
            interval: 15s
            timeout: 10s
            start_period: 60s
            retries: 5
        profiles:
            - gazebo
            - simulation
        stdin_open: true

    # Тот же симулятор, но с двумя роботами: защитник и атакующий. Отдельный
    # сервис, а не переключатель у gazebo, потому что у них разные лаунчи и
    # разный набор аргументов (у дуэли точки спавна заданы в самом лаунче).
    # Профиля simulation здесь нет: duel и gazebo поднимают каждый свой
    # gzserver и вместе работать не могут.
    duel:
        command: $CMD "source /usr/share/gazebo/setup.bash && export GAZEBO_RESOURCE_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_RESOURCE_PATH:-} && export GAZEBO_MODEL_PATH=$${JR_GAZEBO_PATH}:$${GAZEBO_MODEL_PATH:-} && source /autoware/install/setup.bash && ros2 launch sim_kobuki launch_duel.launch.py map:=${DUEL_MAP:-totami} headless:=${GAZEBO_HEADLESS:-true} lidar:=${LIDAR:-false}"
        extends:
            file: common.yaml
            service: app
        environment:
            JR_GAZEBO_PATH: /autoware/install/sim_kobuki/share
            DISPLAY: ${DISPLAY:-:0}
            XAUTHORITY: /tmp/.xauthority
            QT_X11_NO_MITSHM: "1"
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ${XAUTHORITY:-/dev/null}:/tmp/.xauthority:ro
        healthcheck:
            test:
                - CMD-SHELL
                - "bash -lc 'source /autoware/install/setup.bash && ros2 topic list | grep -qx /clock'"
            interval: 15s
            timeout: 10s
            start_period: 60s
            retries: 5
        profiles:
            - duel
        stdin_open: true
