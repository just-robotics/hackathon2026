# Git-подмодули с ROS-пакетами, подключаемыми в src/.
#
# Подключаются командой `helm submodules`. В корне подмодуля лежит
# COLCON_IGNORE. LIO-SAM пока не входит в основной образ: локализация
# в Gazebo берётся из p3d; его сборку подключают отдельно.

submodules:
  # Необязательная локализация по LiDAR/IMU, независимая от MPPI.
  lio_sam:
    url: https://github.com/artem-kondratew/mpc_motion_control.git
    branch: main
    path: src/lio_sam_src
    packages:
      - src/lio_sam_src/workspace/src/lio_sam
