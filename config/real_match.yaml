# Real mission: set measured start poses in the map frame before enabling motion.
# Opponent position is a template, NOT a measured physical start.
# All mission coordinates are in map; angles are radians.
robot:
  role: explorer
  start: [0.5, 0.5, 0.0]
  start_area_half_size: 0.25
opponent:
  start: [0.5, 3.5, 0.0]
  start_area_half_size: 0.25
motion:
  # Applies only to explorer; guardian always translates forward.
  allow_reverse: true
  max_speed: 0.5
  max_angular_speed: 1.5
perception:
  # Model top: 0.0102 + 0.3966 + 0.003 m; includes ~0.05 m sensor margin.
  # Upper 90th height percentile of a candidate cluster in the planar map.
  opponent_max_height: 0.46
match:
  seed: 0
  active_seconds: 600.0
