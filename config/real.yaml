lidar_mount: [0.0, 0.0, 0.3, 0.0, 3.141592653589793, 1.5707963267948966]
# Empty: no map, Nav2 obstacle/inflation layers only. Later: maps/arena.yaml
map_file: ''
arena_bounds: [-10.0, -10.0, 10.0, 10.0]
ros_domain_id: 26
rviz: false
