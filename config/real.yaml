# External hardware configuration; start_real re-reads it without rebuilding.
mission_file: real_match.yaml
kobuki_port: /dev/kobuki
livox_config: livox_mid360.json
# FAST-LIO2 tracks LiDAR/IMU motion from robot.start in real_match.yaml.
# Static-map matching remains available with localization: amcl.
localization: fastlio  # alternatively amcl, odometry or external_tf
fastlio_file: fastlio.yaml
localization_file: localization.yaml
odom_topic: /odom
lidar_topic: /livox/lidar
lidar_filter_file: lidar_filter.yaml
# Approximate HSL25 mounting; verify on hardware. [x,y,z,roll,pitch,yaw].
lidar_mount: [0.0, 0.0, 0.3, 0.0, 3.141592653589793, 1.5707963267948966]
map_file: maps/maze_bag_v1.yaml
arena_bounds: [-0.35, -0.50, 3.35, 4.30]
ros_domain_id: 26
rviz: false

planning_file: planning.yaml
