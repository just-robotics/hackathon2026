# Wall slice above the floor, in base_footprint coordinates (metres).
localization_scan:
  ros__parameters:
    target_frame: base_footprint
    transform_tolerance: 0.2
    min_height: 0.10
    max_height: 0.40
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648
    scan_time: 0.1
    range_min: 0.25
    range_max: 8.0
    use_inf: true
amcl:
  ros__parameters:
    global_frame_id: map
    base_frame_id: base_footprint
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: false
    always_reset_initial_pose: false
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    update_min_d: 0.05
    update_min_a: 0.05
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.25
    laser_max_range: 8.0
    laser_likelihood_max_dist: 0.5
    sigma_hit: 0.1
    z_hit: 0.9
    z_rand: 0.1
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
localization_monitor:
  ros__parameters:
    initial_position_std: 0.25
    initial_yaw_std: 0.35
    max_position_std: 0.20
    max_yaw_std: 0.35
    max_pose_age: 3.0
    max_sensor_age: 1.0

# Map output interpolates the FAST-LIO pose using timestamped AMCL correction.
map_kinematic_state:
  ros__parameters:
    max_pose_age: 3.0
    max_input_age: 0.8
    max_position_std: 0.20
    max_yaw_std: 0.35
