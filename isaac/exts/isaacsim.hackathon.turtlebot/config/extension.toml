[package]
version = "1.0.0"
title = "Hackathon TurtleBot 2"
description = "Spawns TurtleBot 2 (Kobuki) with a Livox Mid-360-like RTX lidar in Simple Room and bridges cmd_vel / PointCloud2."
category = "Simulation"
authors = ["hackathon2026"]

[core]
reloadable = true
order = 2000

[settings]
# Загрузка Simple Room. При false робот стоит на голой плоскости.
# Переопределяется флагом Kit --/exts/isaacsim.hackathon.turtlebot/room=false
# или переменной окружения HACKATHON_ROOM.
exts."isaacsim.hackathon.turtlebot".room = true

[dependencies]
"omni.kit.uiapp" = {}
"omni.usd" = {}
"omni.timeline" = {}
"omni.graph.action" = {}
"isaacsim.core.nodes" = {}
"isaacsim.ros2.bridge" = { optional = true }
"isaacsim.robot.wheeled_robots" = {}
"isaacsim.asset.importer.urdf" = {}
"isaacsim.sensors.experimental.rtx" = { optional = true }
"isaacsim.sensors.rtx" = { optional = true }
"isaacsim.storage.native" = { optional = true }

[[python.module]]
name = "hackathon_turtlebot"
