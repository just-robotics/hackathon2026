# Детектор соперника на бэгах с неподвижного реального лидара
# (jr_perception_bag.launch.xml). Всё, что не задано здесь, берётся по
# умолчанию из кода -- те же значения, что в robot_detector.param.yaml.
/**:
  ros__parameters:
    cloud_topic: "/livox/lidar"
    # Топика позы нет: лидар стоит на месте, его положение в world_frame
    # берётся из /tf_static бэга (base_link -> livox).
    pose_topic: ""
    world_frame: "base_link"
    opponent_frame: "opponent"

    # Фон -- файл от record_background.py (путь задаёт launch), стен из
    # .world нет: запись сделана не на полигоне.
    world: ""
    # дальше этого по плоскости от лидара точки не смотрим, м
    max_range: 6.0

    # Реальный Kobuki: лидар видит стойки и пластины, верх кластера на
    # 0.36-0.43 м над полом (по бэгам 0.5-3 м). Шум у пола -- 3-7 точек
    # высотой 2-3 см, их отсекают min_top и min_points. max_height с запасом:
    # на 3 м верх доходил до 0.428.
    #
    # Видимая дуга робота 0.28-0.34 м, узкие высокие предметы (панель в
    # mov_02) -- 0.16-0.18: их отсекает min_extent.
    #
    # Проверка пробела между пластинами выключена: до 2 м пробел виден, но на
    # 3 м точки по высоте размазываются, и проверка по доле точек в пробеле
    # теряла робота в 40 из 139 кадров, почти не убирая ложных. Проверка по
    # отношению плотностей (max_hole_ratio) на этих бэгах не проверялась.
    robot:
      max_height: 0.50
      min_top: 0.25
      min_points: 10
      min_extent: 0.22
