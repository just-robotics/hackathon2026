# robot_detector.py с локализацией FAST-LIO2 (jr_detector_fastlio.launch.xml).
# Локализация -- FAST-LIO2: поза base_footprint во фрейме map от
# fastlio_bridge.py, лидар относительно базы -- из /tf_static.
# Фон -- карта занятости из /map (map_server на роботе или запись в бэге),
# строится детектором в рантайме.
# Пороги робота -- как у бэгов с реального Kobuki (jr_perception/config/real.yaml).
/**:
  ros__parameters:
    # Облако -- выход сегментации земли (jr_ground_segmentation.launch.xml):
    # свой робот, высота и дальность отфильтрованы до неё, пол -- linefit.
    # Свои фильтры детектора поэтому выключены.
    cloud_topic: "/perception/obstacle_cloud"
    # обрезка входного облака: точки ближе 0.5 м от base_footprint -- прочь
    self_range: 0.5
    floor_z: -1.0
    floor_noise: 0.0
    ceiling_z: 10.0
    pose_topic: "/localization/fastlio/odometry"
    world_frame: "map"
    base_frame: "base_footprint"
    opponent_frame: "opponent"
    world: ""
    background_topic: "/map"
    # запас фона у стен: облако смещено относительно карты на 5-10 см
    map_margin: 0.15
    robot:
      max_height: 0.50
      min_top: 0.25
      min_points: 10
      min_extent: 0.22
