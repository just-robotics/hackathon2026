/**:
  ros__parameters:
    base_frame: base_footprint

    publish_body_markers: true
    tf_timeout: 0.2

    initial_tf_timeout: 10.0
    
    static_boxes:
      names:
        - body
        - floor

      body:
        frame: base_footprint
        min_x: -0.4
        min_y: -0.4
        min_z: -1.00
        max_x:  0.4
        max_y:  0.4
        max_z:  1.00

      floor:
        frame: base_footprint
        min_x: -1000.0
        min_y: -1000.0
        min_z:  -1.0
        max_x:  1000.0
        max_y:  1000.0
        max_z:  0.02
