decision_manager:
  ros__parameters:
    role: explorer
    planning_frame: map
    own_start: [0.25, 0.25, 0.75, 0.25, 0.75, 0.75, 0.25, 0.75]
    # Default polygon_rosbag mission; map origin is the inner lower-left wall corner [-0.468, -0.582].
    opponent_start: [0.25, 3.25, 0.75, 3.25, 0.75, 3.75, 0.25, 3.75]
    pose_timeout: 1.2
    scan_timeout: 1.8
    opponent_timeout: 1.0
    switch_margin: 0.15
    min_dwell: 0.5
    evade_distance: 1.8
    capture_distance: 0.8
    danger_weight: 2.0
    goal_weight: 1.0
    # Own motion capability for interception; rival velocity remains observed.
    own_max_speed: 0.5
    # EVADE держится, пока страж ближе evade_exit_distance и не менее evade_min_hold с.
    evade_exit_distance: 1.8
    evade_min_hold: 2.0
    # Страж на цели (ближе goal_block_radius к её центру): стоять в standoff_distance от него.
    goal_block_radius: 0.95
    standoff_distance: 1.5
