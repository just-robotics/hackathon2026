/**:
  ros__parameters:
    # Радиус соседства. Шаг между соседними точками Mid-360 на дистанции 3-4 м
    # сопоставим с этой величиной, поэтому стена остаётся связной, а одиночные
    # отражения -- нет.
    eps: 0.08

    # Ядровой критерий DBSCAN: сколько точек должно попасть в eps.
    min_points: 1

    # Кластеры мельче отбрасываются вместе с шумом.
    min_cluster_size: 10

    # Но только вблизи: на дальней стене 5-10 точек -- это законная геометрия,
    # а не шум, потому что плотность облака падает с дистанцией. Считается по
    # центроиду кластера, горизонтальная дальность. 0 -- без ограничения.
    min_cluster_size_radius: 1.6

    # Livox отдаёт невалидные измерения как ровно нулевые точки (в кадре
    # Mid-360 их около половины) при is_dense = true, так что по NaN их не
    # отсечь. Отбрасываются до кластеризации.
    min_range: 0.05

    # Предохранитель: кадр плотнее проходит без фильтрации.
    max_points: 30000
