# Частота публикации /clock плагином gazebo_ros_init.
#
# По умолчанию 10 Гц, и это потолок для всех нод на симулированном времени:
# таймер ROS не срабатывает чаще, чем приходит время. Планировщик на 50 Гц
# из-за этого выдавал около 19.
#
# 50 Гц совпадает с частотой одометрии diff_drive, так что путь
# перестраивается на каждую новую позу робота.
gazebo:
  ros__parameters:
    publish_rate: 50.0
